    <style amp-custom>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        a { text-decoration: none; color: inherit; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Raleway', sans-serif;
            background-color: #030000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* 1. ANIMATED AURORA BACKGROUND */
        .ambient-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 0;
            overflow: hidden;
            background: #050101;
        }
        
        .aurora-orb-1, .aurora-orb-2 {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.6;
            animation: float-orb 15s ease-in-out infinite alternate;
        }
        
        .aurora-orb-1 {
            width: 80vw; height: 80vw;
            background: radial-gradient(circle, #ff0033 0%, transparent 70%);
            top: -20%; left: -20%;
        }
        
        .aurora-orb-2 {
            width: 70vw; height: 70vw;
            background: radial-gradient(circle, #8a001c 0%, transparent 70%);
            bottom: -10%; right: -20%;
            animation-delay: -5s;
        }

        @keyframes float-orb {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(10%, 15%) scale(1.2); }
            100% { transform: translate(-10%, -10%) scale(0.9); }
        }

        /* 2. MAIN GLASS CONTAINER */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .glass-card {
            width: 100%;
            background: rgba(15, 2, 2, 0.45);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 50, 50, 0.15);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            padding: 2.5rem 1.5rem;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8), inset 0 0 40px rgba(255, 0, 50, 0.05);
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
        }

        /* Logo */
        .logo-box {
            text-align: center;
            filter: drop-shadow(0 10px 15px rgba(255, 0, 50, 0.4));
            transform: translateZ(0);
        }

        /* 3D Banner */
        .banner-3d {
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.1);
            position: relative;
        }
        .banner-3d::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, transparent 50%, rgba(0,0,0,0.4) 100%);
            pointer-events: none;
        }

        /* 3. GLOSSY HERO BUTTON */
        .btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            border-radius: 16px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .btn-register {
            padding: 1.2rem;
            background: linear-gradient(135deg, #ff003c 0%, #aa0022 100%);
            box-shadow: 
                0 15px 30px rgba(255, 0, 60, 0.4),
                inset 0 2px 0 rgba(255, 255, 255, 0.4),
                inset 0 -4px 0 rgba(0, 0, 0, 0.2);
            border: none;
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            animation: pulse-glow 2s infinite;
        }

        /* Liquid light sweep effect */
        .btn-register::before {
            content: '';
            position: absolute;
            top: 0; left: -150%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
            transform: skewX(-25deg);
            animation: sweep 4s infinite cubic-bezier(0.77, 0, 0.17, 1);
        }

        .btn-register span {
            font-family: 'Raleway', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 3px;
            color: #ffd0d8;
            margin-top: 0.3rem;
            font-weight: 600;
            text-shadow: none;
        }

        @keyframes sweep {
            0% { left: -150%; }
            50%, 100% { left: 150%; }
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 15px 30px rgba(255, 0, 60, 0.4), inset 0 2px 0 rgba(255, 255, 255, 0.4); }
            50% { box-shadow: 0 20px 45px rgba(255, 0, 60, 0.6), inset 0 2px 0 rgba(255, 255, 255, 0.4); }
        }

        /* 4. FUTURISTIC DIVIDER */
        .cyber-divider {
            position: relative;
            text-align: center;
            margin: 0.5rem 0;
        }
        .cyber-divider::before {
            content: '';
            position: absolute;
            top: 50%; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 50, 50, 0.5), transparent);
        }
        .cyber-divider span {
            position: relative;
            background: #0d0202;
            padding: 0.4rem 1.2rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 50, 50, 0.3);
            color: #ffb3b3;
            font-size: 0.65rem;
            letter-spacing: 3px;
            font-weight: 700;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(255, 0, 50, 0.2);
        }

        /* 5. TACTILE LOGIN GRID */
        .login-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .btn-login {
            background: rgba(20, 5, 5, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 2px solid #ff003c;
            padding: 1rem 0.5rem;
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 12px;
            box-shadow: inset 0 20px 20px -20px rgba(255,255,255,0.1);
        }

        .btn-login span {
            font-size: 0.55rem;
            color: #999;
            letter-spacing: 1px;
            margin-top: 0.3rem;
            font-weight: 500;
        }

        /* 6. FLOATING DOCK APP-STYLE */
        .app-dock {
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            margin-top: 1rem;
            background: rgba(0, 0, 0, 0.5);
            padding: 1rem 2rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .dock-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.65rem;
            color: #ccc;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .dock-item svg {
            width: 20px;
            height: 20px;
            stroke: #ff003c;
            filter: drop-shadow(0 0 5px rgba(255,0,60,0.5));
        }

        .copyright {
            text-align: center;
            font-size: 0.6rem;
            color: #444;
            letter-spacing: 2px;
            margin-top: 2rem;
        }
    </style>
</head>
